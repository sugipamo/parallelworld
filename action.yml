name: parallelworld check
description: >-
  Hold a repository's declared facts (pw-facts.json) against its files as they are checked out:
  the check (the executable published for this commit's source, or built from it), and Lean if
  the declaration needs it.
  No agent is used.

# For another repository's workflow. Pin this action by commit; that one commit then fixes
# everything else: the checker (rust/release.txt names the executable published for exactly this
# source, by SHA-256; where it names none, or one of other source, it is built from source with
# the crates pinned by rust/Cargo.lock: ci/pw.sh) and Lean (the version in lean/lean-toolchain,
# by checksum, ci/lean.sh). Nothing is cached from one job to the next.
#
#     - uses: actions/checkout@<commit>
#     - uses: sugipamo/parallelworld@<commit>
#
# The job needs nothing beyond reading the repository (permissions: contents: read).

inputs:
  repo:
    description: The directory whose pw-facts.json is checked, relative to the workspace.
    default: "."
  args:
    description: >-
      Further arguments to the check (pw check: --verify, --unconfirmed warn, --lean always, --json).
      The default runs the proofs in the record through Lean again instead of believing them.
    default: "--verify"
  build:
    description: >-
      "auto": take the executable rust/release.txt names when it is of this source, else build.
      "source": always build from source (a minute and a half on four cores).
    default: "auto"

runs:
  using: composite
  steps:
    - name: The check, published for this source or built from it
      shell: bash
      env:
        PW_BUILD: ${{ inputs.build }}
      run: |
        bin=$("$GITHUB_ACTION_PATH/ci/pw.sh" "$RUNNER_TEMP/parallelworld-bin")
        echo "PW_BIN=$bin" >> "$GITHUB_ENV"
        echo "PW_LEAN_DIR=$GITHUB_ACTION_PATH/lean" >> "$GITHUB_ENV"
        "$bin" version

    # Written-out values are compared as they stand. Lean is fetched only where something has
    # to be worked out: a fact defined from other facts, or every comparison if `args` asks for it.
    - name: Lean, by checksum, if the declaration needs it
      shell: bash
      env:
        PW_REPO: ${{ inputs.repo }}
        PW_ARGS: ${{ inputs.args }}
      run: |
        needed=$("$PW_BIN" check --repo "$PW_REPO" --needs-lean)
        case " $PW_ARGS " in *" --lean always "*) needed=yes ;; esac
        echo "Lean needed: $needed"
        if [ "$needed" = yes ]; then
          bin=$("$GITHUB_ACTION_PATH/ci/lean.sh" "$RUNNER_TEMP/parallelworld-lean")
          echo "$bin" >> "$GITHUB_PATH"
        fi

    - name: Facts, held against the files
      shell: bash
      env:
        PW_REPO: ${{ inputs.repo }}
        PW_ARGS: ${{ inputs.args }}
      run: '"$PW_BIN" check --repo "$PW_REPO" $PW_ARGS'
