name: decisions

# Hold the project's facts and decisions against the files as they are in this commit.
# Nothing here needs an agent: places with a declared way of reading are read again, the
# recorded proofs are run through Lean again, and readings stated by an agent count only
# for the exact content they were made for.
#
# Everything this job fetches is pinned to content, not to a name that can be moved:
# the actions by commit, the Python packages by hash (requirements-ci.txt, requirements-test.txt),
# Lean by checksum (ci/lean.sh), the Rust crates by checksum (rust/Cargo.lock). The Rust compiler
# is the runner's own.
# The job can read the repository and nothing else.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
        with:
          persist-credentials: false

      # The same steps another repository gets by using this one as an action (action.yml):
      # Python and its packages, the Lean that lean/lean-toolchain names, then pw.check --verify.
      - name: Facts and decisions, with the recorded proofs verified again
        uses: ./

      - name: What a person still has to confirm
        if: always()
        run: python -m pw.confirm | tee -a "$GITHUB_STEP_SUMMARY"

      # The check, written again in Rust. Its crates are pinned by rust/Cargo.lock (version and
      # checksum); the tests hold its verdicts against the Python check's.
      - name: The Rust check
        if: always()
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: Packages the tests need, by hash
        if: always()
        run: pip install --require-hashes -r requirements-test.txt

      # (this repository declares a definition, so the step above has fetched Lean; the tests need it too)
      - name: Tests
        if: always()
        run: python -m pytest -q tests
